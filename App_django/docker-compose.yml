version: '3.7'

services:

  nginx:
    image: nginx:latest
    volumes:
      - type: bind
        source: ./proxy/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - "80:80"
  
  app:
    build: 
      context: ./djangorest_crud
    ports:
      - "8080:8080"
  db:
    image: postgres:13
    restart: always 
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_db:/var/lib/postgresql/data
    ports:
      - "5432:5432"


volumes:
  postgres_db:

